<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Project Status Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    header p {
      font-size: 14px;
      color: #666;
    }

    .card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-header label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }

    .char-count {
      font-size: 12px;
      color: #aaa;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #999;
      background: white;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 9px 24px;
      font-size: 14px;
      font-weight: 500;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary:hover { background: #333; }
    .btn-primary:disabled { background: #999; cursor: not-allowed; }

    .btn-secondary {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 500;
      background: white;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-secondary:hover { background: #f5f5f5; }

    .btn-sample {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 500;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-sample:hover { background: #dbeafe; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 16px;
    }

    .metric-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 600;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .summary-text {
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a1a;
    }

    .risk-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      line-height: 1.5;
    }

    .risk-item:last-child { border-bottom: none; }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      margin-top: 1px;
    }

    .badge-high { background: #fee2e2; color: #991b1b; }
    .badge-med  { background: #fef3c7; color: #92400e; }
    .badge-low  { background: #dcfce7; color: #166534; }

    .action-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      line-height: 1.5;
    }

    .action-item:last-child { border-bottom: none; }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ccc;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #results { display: none; }

    #loading {
      display: none;
      text-align: center;
      padding: 32px;
      color: #666;
      font-size: 14px;
    }

    .timestamp {
      font-size: 12px;
      color: #aaa;
      text-align: right;
      margin-bottom: 12px;
    }

    .error-banner {
      display: none;
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .no-risks {
      font-size: 13px;
      color: #16a34a;
      padding: 8px 0;
    }

    .health-green { color: #16a34a; }
    .health-amber { color: #d97706; }
    .health-red   { color: #dc2626; }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>AI Project Status Dashboard</h1>
      <p>Paste your project update — get instant summary, risks, and action items</p>
    </header>

    <div class="card">
      <div class="input-header">
        <label for="update-input">Project update</label>
        <span class="char-count" id="char-count">0 characters</span>
      </div>
      <textarea
        id="update-input"
        placeholder="Paste your project update here... e.g. Sprint 3 is 80% complete. The backend is done but frontend is delayed by 2 days. QA found 3 critical bugs."
        oninput="updateCharCount()"
      ></textarea>
      <div class="button-row">
        <button class="btn-primary" id="analyze-btn" onclick="analyzeUpdate()">
          Analyze update
        </button>
        <button class="btn-sample" onclick="loadSample()">
          Try sample update
        </button>
        <button class="btn-secondary" onclick="clearAll()">
          Clear
        </button>
      </div>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div id="loading">
      <span class="spinner"></span>
      Analyzing your project update...
    </div>

    <div id="results">

      <div class="timestamp" id="timestamp"></div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Overall health</div>
          <div class="metric-value" id="health-value">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Risks flagged</div>
          <div class="metric-value" id="risk-count">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Action items</div>
          <div class="metric-value" id="action-count">—</div>
        </div>
      </div>

      <div class="card">
        <p class="section-title">Summary</p>
        <p class="summary-text" id="summary-text"></p>
      </div>

      <div class="card">
        <p class="section-title">Risks</p>
        <div id="risks-list"></div>
      </div>

      <div class="card">
        <p class="section-title">Action items</p>
        <div id="actions-list"></div>
      </div>

    </div>
  </div>

  <script>
    const SAMPLE_TEXT = `Sprint 4 is 70% complete and the backend API integration is finished. However the mobile UI has a critical bug that is blocking the QA team from testing. The launch is delayed by 3 days due to a dependency on the design team who are still finalizing assets. We need to escalate this to the director today. The team should schedule a daily standup to track the bug resolution. Stakeholder update is pending and must be sent by EOD.`;

    function updateCharCount() {
      const text = document.getElementById('update-input').value;
      const count = text.length;
      const el = document.getElementById('char-count');
      el.textContent = count + ' character' + (count !== 1 ? 's' : '');
      el.style.color = count > 1000 ? '#d97706' : '#aaa';
    }

    function loadSample() {
      document.getElementById('update-input').value = SAMPLE_TEXT;
      updateCharCount();
      hideError();
    }

    function clearAll() {
      document.getElementById('update-input').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('char-count').textContent = '0 characters';
      document.getElementById('char-count').style.color = '#aaa';
      hideError();
    }

    function showError(message) {
      const banner = document.getElementById('error-banner');
      banner.textContent = message;
      banner.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-banner').style.display = 'none';
    }

    async function analyzeUpdate() {
      const text = document.getElementById('update-input').value.trim();

      if (!text) {
        showError('Please paste a project update or click "Try sample update" to see a demo.');
        return;
      }

      if (text.length < 20) {
        showError('Please enter a more detailed project update (at least a sentence or two).');
        return;
      }

      hideError();
      document.getElementById('analyze-btn').disabled = true;
      document.getElementById('results').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          throw new Error('Server returned an error. Make sure app.py is running.');
        }

        const data = await response.json();
        displayResults(data);

      } catch (error) {
        showError('Could not connect to the server. Make sure app.py is running in your terminal.');
      } finally {
        document.getElementById('analyze-btn').disabled = false;
        document.getElementById('loading').style.display = 'none';
      }
    }

    function displayResults(data) {
      const now = new Date();
      document.getElementById('timestamp').textContent =
        'Last analyzed: ' + now.toLocaleDateString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });

      const healthEl = document.getElementById('health-value');
      healthEl.textContent = data.health;
      healthEl.className = 'metric-value';
      if (data.health === 'On track') healthEl.classList.add('health-green');
      else if (data.health === 'At risk') healthEl.classList.add('health-amber');
      else healthEl.classList.add('health-red');

      document.getElementById('risk-count').textContent = data.risks.length;
      document.getElementById('action-count').textContent = data.actions.length;
      document.getElementById('summary-text').textContent = data.summary;

      const risksList = document.getElementById('risks-list');
      risksList.innerHTML = '';
      if (data.risks.length === 0) {
        risksList.innerHTML = '<p class="no-risks">No risks detected — project looks healthy!</p>';
      } else {
        data.risks.forEach(risk => {
          const div = document.createElement('div');
          div.className = 'risk-item';
          const badgeClass = risk.level === 'High' ? 'badge-high' :
                             risk.level === 'Medium' ? 'badge-med' : 'badge-low';
          div.innerHTML = `<span class="badge ${badgeClass}">${risk.level}</span>
                           <span>${risk.text}</span>`;
          risksList.appendChild(div);
        });
      }

      const actionsList = document.getElementById('actions-list');
      actionsList.innerHTML = '';
      data.actions.forEach(action => {
        const div = document.createElement('div');
        div.className = 'action-item';
        div.innerHTML = `<div class="dot"></div><span>${action}</span>`;
        actionsList.appendChild(div);
      });

      document.getElementById('results').style.display = 'block';
      document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
